name: Implement Feature Spec

on:
  push:
    paths:
      - 'docs/specs/*.md'
      - '!docs/specs/_implemented/**'
      - '!docs/specs/_samples/**'
      - 'specs/**/spec.md'
    branches:
      - 'feature/**'
  workflow_dispatch:
    inputs:
      spec_path:
        description: 'Path to specification file or directory (e.g., docs/specs/my-feature.md or specs/my-feature)'
        required: true
        type: string
      branch:
        description: 'Target feature branch (defaults to current branch)'
        required: false
        type: string
      create_pr:
        description: 'Whether to automatically open a Pull Request upon completion'
        required: false
        type: boolean
        default: true

jobs:
  implement-spec:
    name: Run Implementer Agent
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      id-token: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Authenticate to Google Cloud via WIF
        id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.WIF_SERVICE_ACCOUNT }}
          id_token_audience: ${{ vars.IMPLEMENTER_SERVICE_URL }}
          id_token_include_email: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Determine Spec Path and Branch
        id: params
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            SPEC_PATH="${{ inputs.spec_path }}"
            BRANCH="${{ inputs.branch }}"
            CREATE_PR="${{ inputs.create_pr }}"
          else
            # Find modified/added spec from git diff
            SPEC_PATH=$(git diff --name-only HEAD~1 HEAD | grep -E '^docs/specs/.*\.md|^specs/.*/spec\.md' | head -n 1 || echo "")
            BRANCH="${GITHUB_REF_NAME}"
            CREATE_PR="true"
          fi

          if [ -z "$BRANCH" ]; then
            BRANCH="${GITHUB_REF_NAME}"
          fi

          echo "spec_path=${SPEC_PATH}" >> "$GITHUB_OUTPUT"
          echo "branch=${BRANCH}" >> "$GITHUB_OUTPUT"
          echo "create_pr=${CREATE_PR}" >> "$GITHUB_OUTPUT"
          echo "Target Spec: ${SPEC_PATH}"
          echo "Target Branch: ${BRANCH}"

      - name: Invoke Implementer Agent Service
        env:
          ID_TOKEN: ${{ steps.auth.outputs.id_token }}
          SERVICE_URL: ${{ vars.IMPLEMENTER_SERVICE_URL }}
          REPO_URL: ${{ github.server_url }}/${{ github.repository }}.git
          SPEC_PATH: ${{ steps.params.outputs.spec_path }}
          BRANCH: ${{ steps.params.outputs.branch }}
          CREATE_PR: ${{ steps.params.outputs.create_pr }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -z "$SPEC_PATH" ]; then
            echo "Error: No specification path provided or detected."
            exit 1
          fi

          echo "============================================================"
          echo " Invoking Implementer Agent on Cloud Run"
          echo " Service URL: ${SERVICE_URL}"
          echo " Spec Path:   ${SPEC_PATH}"
          echo " Branch:      ${BRANCH}"
          echo "============================================================"

          python3 - << 'PYEOF'
          import json
          import os
          import sys
          import urllib.request
          import urllib.error

          service_url = os.environ.get("SERVICE_URL", "").rstrip("/")
          id_token = os.environ.get("ID_TOKEN", "")
          spec_path = os.environ.get("SPEC_PATH", "")
          repo_url = os.environ.get("REPO_URL", "")
          branch = os.environ.get("BRANCH", "")
          github_token = os.environ.get("GITHUB_TOKEN", "")
          create_pr = os.environ.get("CREATE_PR", "true").lower() == "true"

          url = f"{service_url}/tasks"
          payload = {
              "spec_path": spec_path,
              "repo_url": repo_url,
              "branch": branch,
              "github_token": github_token,
              "create_pr": create_pr,
          }

          headers = {
              "Authorization": f"Bearer {id_token}",
              "Content-Type": "application/json",
              "Accept": "text/event-stream",
          }

          req = urllib.request.Request(url, data=json.dumps(payload).encode("utf-8"), headers=headers, method="POST")

          try:
              with urllib.request.urlopen(req, timeout=3600) as resp:
                  for raw_line in resp:
                      line = raw_line.decode("utf-8", errors="replace")
                      if line.startswith("data: "):
                          print(line[6:], end="", flush=True)
                      elif line.startswith("data:"):
                          print(line[5:], end="", flush=True)
                      elif line.strip() and not line.startswith(":"):
                          print(line, end="", flush=True)
          except urllib.error.HTTPError as e:
              err_msg = e.read().decode("utf-8", errors="replace")
              print(f"HTTP Error {e.code}: {err_msg}", file=sys.stderr)
              sys.exit(1)
          except Exception as e:
              print(f"Error invoking service: {e}", file=sys.stderr)
              sys.exit(1)
          PYEOF

