name: Implement Feature Spec

on:
  push:
    paths:
      - 'docs/specs/*.md'
      - '!docs/specs/_implemented/**'
      - '!docs/specs/_samples/**'
      - 'specs/**/spec.md'
  workflow_dispatch:
    inputs:
      spec_path:
        description: 'Path to specification file or directory (e.g., docs/specs/my-feature.md or specs/my-feature)'
        required: true
        type: string
      branch:
        description: 'Target feature branch (defaults to current branch)'
        required: false
        type: string
      create_pr:
        description: 'Whether to automatically open a Pull Request upon completion'
        required: false
        type: boolean
        default: true

jobs:
  implement-spec:
    name: Run Implementer Agent
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      id-token: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Authenticate to Google Cloud via WIF
        id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.WIF_SERVICE_ACCOUNT }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          version: "latest"

      - name: Install Implementer Dependencies
        run: |
          uv pip install --system -r sdlc-agents/implementer/pyproject.toml

      - name: Configure Git Identity
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Determine Spec Path and Branch
        id: params
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            SPEC_PATH="${{ inputs.spec_path }}"
            BRANCH="${{ inputs.branch }}"
            CREATE_PR="${{ inputs.create_pr }}"
          else
            BEFORE="${{ github.event.before }}"
            AFTER="${{ github.sha }}"
            if [ -n "$BEFORE" ] && [ "$BEFORE" != "0000000000000000000000000000000000000000" ] && git cat-file -e "$BEFORE" 2>/dev/null; then
              SPEC_PATH=$(git diff --name-only "$BEFORE" "$AFTER" | grep -E '^docs/specs/.*\.md|^specs/.*/spec\.md' | grep -v '^docs/specs/_' | head -n 1 || echo "")
            else
              SPEC_PATH=$(git diff --name-only HEAD~1 HEAD 2>/dev/null | grep -E '^docs/specs/.*\.md|^specs/.*/spec\.md' | grep -v '^docs/specs/_' | head -n 1 || echo "")
            fi
            BRANCH="${GITHUB_REF_NAME}"
            CREATE_PR="true"
          fi

          if [ -z "$BRANCH" ]; then
            BRANCH="${GITHUB_REF_NAME}"
          fi

          echo "spec_path=${SPEC_PATH}" >> "$GITHUB_OUTPUT"
          echo "branch=${BRANCH}" >> "$GITHUB_OUTPUT"
          echo "create_pr=${CREATE_PR}" >> "$GITHUB_OUTPUT"
          echo "Target Spec:   ${SPEC_PATH}"
          echo "Target Branch: ${BRANCH}"
          echo "Create PR:     ${CREATE_PR}"

      - name: Run Implementer Agent
        env:
          GOOGLE_GENAI_USE_VERTEXAI: "true"
          GOOGLE_CLOUD_PROJECT: ${{ vars.GCP_PROJECT_ID }}
          GOOGLE_GENAI_LOCATION: "global"
          GOOGLE_GENAI_MODEL: ${{ vars.GOOGLE_GENAI_MODEL || 'gemini-3.7-flash' }}
        run: |
          SPEC_PATH="${{ steps.params.outputs.spec_path }}"
          BRANCH="${{ steps.params.outputs.branch }}"

          if [ -z "$SPEC_PATH" ]; then
            echo "Error: No specification path provided or detected."
            exit 1
          fi

          echo "============================================================"
          echo " Running Implementer Agent on GitHub Actions Worker"
          echo " Spec Path:    ${SPEC_PATH}"
          echo " Branch:       ${BRANCH}"
          echo " Model:        ${GOOGLE_GENAI_MODEL}"
          echo " GCP Project:  ${GOOGLE_CLOUD_PROJECT}"
          echo " Location:     ${GOOGLE_GENAI_LOCATION}"
          echo "============================================================"

          python3 sdlc-agents/implementer/main.py "${SPEC_PATH}" --branch "${BRANCH}"

      - name: Push Changes to Feature Branch
        run: |
          BRANCH="${{ steps.params.outputs.branch }}"
          echo "Pushing committed changes to origin/${BRANCH}..."
          git push origin "${BRANCH}"

      - name: Open or Update Pull Request
        if: steps.params.outputs.create_pr == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BRANCH: ${{ steps.params.outputs.branch }}
          SPEC_PATH: ${{ steps.params.outputs.spec_path }}
        run: |
          FEATURE_NAME=$(basename "${SPEC_PATH}" .md)
          PR_TITLE="feat(${FEATURE_NAME}): implement ${FEATURE_NAME}"
          PR_BODY=$(cat << EOF
          ## 🤖 SDLC Implementer Agent: ${FEATURE_NAME}

          Automated implementation and verification completed successfully on the GitHub Actions worker.

          - **Specification**: \`${SPEC_PATH}\`
          - **Feature Branch**: \`${BRANCH}\`
          - **Base Branch**: \`main\`
          - **Engine**: Antigravity SDK on Gemini 3.8 Global Vertex AI

          ---
          *Generated automatically by SDLC Implementer Agent (GitHub Actions Worker)*
          EOF
          )

          EXISTING_PR=$(gh pr view "${BRANCH}" --json number,url 2>/dev/null || echo "")

          if [ -n "$EXISTING_PR" ]; then
            PR_NUM=$(echo "$EXISTING_PR" | jq -r '.number')
            PR_URL=$(echo "$EXISTING_PR" | jq -r '.url')
            echo "Existing PR found: #${PR_NUM} (${PR_URL}). Updating..."

            gh pr edit "${PR_NUM}" --title "${PR_TITLE}" --body "${PR_BODY}" || true
            gh pr comment "${PR_NUM}" --body "🔄 **Implementer Agent Update**: Re-verified and pushed updated changes for \`${BRANCH}\`." || true
            echo "Pull Request #${PR_NUM} updated successfully."
          else
            echo "Creating new Pull Request against main..."
            PR_URL=$(gh pr create \
              --base "main" \
              --head "${BRANCH}" \
              --title "${PR_TITLE}" \
              --body "${PR_BODY}" \
              --label "automated-pr,implementer" 2>&1 || \
              gh pr create \
              --base "main" \
              --head "${BRANCH}" \
              --title "${PR_TITLE}" \
              --body "${PR_BODY}")
            echo "Pull Request created: ${PR_URL}"
          fi

